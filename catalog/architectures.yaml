schema_version: 1.0.0
updated: "2026-10-14"
canonical_documentation: https://www.backblaze.com/docs/cloud-storage-ai-machine-learning
architectures:
  - id: stream-training-data
    name: Stream versioned training shards from B2 to GPU workers
    slug: stream-training-data
    summary: Package a released dataset as immutable WebDataset shards on B2, then stream them into data loaders on every worker with an optional local cache keyed by checksum.
    audience:
      - ML platform engineers
      - Training infrastructure teams
      - Data engineers preparing training-ready datasets
    problem: Feed many GPU workers from one durable copy of a large dataset without copying it to every node first, while proving which exact dataset version each run consumed.
    workflow:
      - Package a released dataset into sequential tar shards and write the shard manifest last
      - Pin the run to a dataset version and verify its fingerprint before training starts
      - Assign shards to ranks and data-loader workers
      - Stream shards over the S3-compatible API with ranged or sequential GETs
      - Cache hot shards on local NVMe keyed by SHA-256 when epochs re-read the same data
      - Record the dataset pin in every checkpoint and model manifest
    capabilities:
      - S3-compatible API
      - Scoped application keys
      - Multipart upload
      - Object versions and lifecycle rules
      - Event notifications
      - SSE-B2
      - Included egress to compute partners
      - B2 Overdrive for sustained high-throughput reads
    integrations:
      - id: pytorch
        name: PyTorch
        role: Training framework; IterableDataset streaming and distributed checkpointing
        support: s3-compatible-endpoint
        connection: boto3 or fsspec/s3fs clients configured with the regional B2 endpoint; no PyTorch-specific B2 code is required
        url: https://pytorch.org/docs/stable/data.html
        evidence: PyTorch data and distributed checkpoint source review recorded 2026-05; sample application tests 2026-10-14
      - id: webdataset
        name: WebDataset
        role: Sequential tar-shard format and loader for large-scale training
        support: s3-compatible-endpoint
        connection: Shards read through fsspec URLs or a pipe command whose S3 client uses the B2 endpoint
        url: https://github.com/webdataset/webdataset
        evidence: Format followed by the shared dataset and the existing WebDataset streaming sample; reviewed 2026-10-14
      - id: ray
        name: Ray Train, Tune, and Data
        role: Distributed training, hyperparameter tuning, and parallel data loading
        support: s3-compatible-endpoint
        connection: pyarrow.fs.S3FileSystem with endpoint_override passed as storage_filesystem or to Ray Data readers
        url: https://docs.ray.io/en/latest/train/user-guides/persistent-storage.html
        evidence: Ray storage source review recorded 2026-05 (ray/train/_internal/storage.py); Ray Train notebook in the sample organization
      - id: tensorflow-io
        name: TensorFlow with tensorflow-io
        role: tf.data input pipelines over TFRecord files
        support: s3-compatible-endpoint
        connection: tensorflow-io S3 filesystem with the S3_ENDPOINT environment variable set to the B2 endpoint
        url: https://github.com/tensorflow/io
        evidence: TensorFlow and tensorflow-io source review recorded 2026-05
      - id: hf-datasets
        name: Hugging Face Datasets
        role: Dataset loading and preprocessing for transformer training
        support: s3-compatible-endpoint
        connection: fsspec storage_options with client_kwargs.endpoint_url set to the B2 endpoint
        url: https://huggingface.co/docs/datasets/filesystems
        evidence: Hugging Face Datasets filesystem documentation reviewed 2026-10-14
    prerequisites:
      - A private B2 bucket for training-ready datasets, separate from checkpoints and models
      - A read-only key scoped to datasets/ for training workers
      - Compute with local NVMe when epochs re-read the same shards
      - Shards sized for sequential reads, typically hundreds of megabytes to a few gigabytes
    expected_scale:
      profile: Multi-node GPU training reading terabytes per epoch
      notes: Standard B2 is the default. Measure per-worker throughput and GPU idle time first; consider a local cache for repeated epochs and B2 Overdrive when aggregate object-store throughput is the bottleneck.
    validation:
      status: source-reviewed-and-automated-tests
      date: "2026-10-14"
      methods:
        - Framework source and documentation review
        - B2 S3 compatibility and key capability review
        - Moto-backed S3 application tests for streaming, fingerprint pinning, and local caching
      evidence:
        - applications/pytorch-b2-checkpointed-training/tests
        - architectures/stream-training-data/architecture.md
    security_considerations:
      - Give training workers read-only keys scoped to datasets/ and never the publisher key
      - Refuse to train when the shard manifest fingerprint differs from the pinned value
      - Keep keys in a secret store or Kubernetes Secret, not in container images
    compliance_considerations:
      - Record the dataset id and fingerprint in every checkpoint and model manifest for lineage
      - Carry dataset license and provenance class from the upstream release into the shard manifest
      - Delete cached shards when a dataset is withdrawn for rights or privacy reasons
    links:
      architecture: architectures/stream-training-data/architecture.md
      application: applications/pytorch-b2-checkpointed-training/README.md
      deployment: infrastructure/kubernetes/README.md
      sample_data: testdata/synthetic-shapes/README.md
      run_contract: docs/training-run-contract.md

  - id: checkpoint-and-resume-training
    name: Checkpoint distributed training to B2 and resume after interruption
    slug: checkpoint-and-resume-training
    summary: Save sharded checkpoints to local disk, upload them to B2 with a manifest written last, resume from the newest complete checkpoint, and lock promoted checkpoints.
    audience:
      - ML engineers running long or preemptible training jobs
      - Training infrastructure teams
      - Security and storage architects
    problem: Survive node loss, preemption, and job restarts on any compute provider without losing progress or resuming from a half-written checkpoint.
    workflow:
      - Save a sharded checkpoint to local staging on each rank
      - Upload shards in parallel with multipart transfers
      - Write the checkpoint manifest last as the commit marker
      - On restart, list checkpoints and resume from the newest one that has a manifest
      - Promote a selected checkpoint to an Object Lock models prefix with lineage
      - Prune superseded checkpoints and let lifecycle rules purge hidden versions
    capabilities:
      - S3-compatible API
      - Multipart upload
      - Scoped application keys
      - Server-side copy
      - Object versions and lifecycle rules
      - SSE-B2 and Object Lock
      - Event notifications
      - Cloud Replication for disaster recovery
    integrations:
      - id: pytorch
        name: PyTorch
        role: Training framework; IterableDataset streaming and distributed checkpointing
        support: s3-compatible-endpoint
        connection: torch.distributed.checkpoint writes to local staging, or FsspecWriter targets s3:// paths through s3fs with the B2 endpoint
        url: https://pytorch.org/docs/stable/distributed.checkpoint.html
        evidence: PyTorch distributed checkpoint source review recorded 2026-05 (FsspecWriter forwards storage options to fsspec); sample application tests 2026-10-14
      - id: ray
        name: Ray Train, Tune, and Data
        role: Distributed training, hyperparameter tuning, and parallel data loading
        support: s3-compatible-endpoint
        connection: RunConfig(storage_path=..., storage_filesystem=pyarrow.fs.S3FileSystem(endpoint_override=...)) persists Train and Tune checkpoints to B2
        url: https://docs.ray.io/en/latest/train/user-guides/persistent-storage.html
        evidence: Ray storage source review recorded 2026-05 (ray/train/_internal/storage.py); Ray Train notebook in the sample organization
      - id: lightning
        name: PyTorch Lightning
        role: Training loop with ModelCheckpoint callbacks
        support: candidate
        connection: fsspec-backed checkpoint paths with storage options for the B2 endpoint
        url: https://lightning.ai/docs/pytorch/stable/common/checkpointing_advanced.html
        evidence: Lightning remote-filesystem checkpoint documentation reviewed 2026-10-14; B2 behavior not yet tested in this repository
    prerequisites:
      - Separate B2 buckets or prefixes for checkpoints and promoted models
      - An Object-Lock-enabled models bucket when promoted models must be immutable
      - Local staging disk large enough for one checkpoint per rank
      - A writer key scoped to checkpoints/ and a separate promoter key scoped to models/
    expected_scale:
      profile: Checkpoints from megabytes to multiple terabytes written every few minutes to hours
      notes: Upload throughput, not storage capacity, bounds checkpoint frequency. Stage locally, upload asynchronously, and parallelize per shard. Standard B2 is the default; evaluate B2 Overdrive when checkpoint upload time limits training cadence.
    validation:
      status: source-reviewed-and-automated-tests
      date: "2026-10-14"
      methods:
        - PyTorch and Ray checkpoint source review
        - B2 Object Lock, lifecycle, and key capability documentation review
        - Moto-backed S3 application tests for manifest-last commits, resume, promotion, and pruning
      evidence:
        - applications/pytorch-b2-checkpointed-training/tests
        - architectures/checkpoint-and-resume-training/architecture.md
    security_considerations:
      - Use a checkpoint writer key without deleteFiles and a separate pruning key that cannot touch models/
      - Promote with a key that has writeFileRetentions but not bypassGovernance
      - Never resume from a checkpoint whose manifest is missing or whose file checksums do not match
      - Treat checkpoints as sensitive when training data contains personal or licensed content
    compliance_considerations:
      - Make retention an explicit promotion decision; lock production models in governance mode and choose compliance mode only for a contractual or regulatory requirement
      - Keep dataset pins and source checkpoint fingerprints in the model manifest
      - Set lifecycle periods for superseded checkpoints from cost and audit requirements
    links:
      architecture: architectures/checkpoint-and-resume-training/architecture.md
      application: applications/pytorch-b2-checkpointed-training/README.md
      deployment: infrastructure/kubernetes/README.md
      sample_data: testdata/synthetic-shapes/README.md
      run_contract: docs/training-run-contract.md

  - id: track-experiments-and-register-models
    name: Track experiments and register models with a B2 artifact store
    slug: track-experiments-and-register-models
    summary: Keep tracking metadata in a database, store run artifacts and registered model files on B2, and register promoted models automatically from B2 event notifications.
    audience:
      - ML engineers and data scientists
      - MLOps platform teams
      - Model governance reviewers
    problem: Keep model files, evaluation artifacts, and lineage durable and shareable across teams while the tracking server stays small and stateless apart from its database.
    workflow:
      - Run the tracking server with a database backend and a B2 artifact root
      - Log parameters, metrics, the dataset pin, and artifacts from training jobs
      - Register a model version from run artifacts
      - Promote a version by alias after evaluation
      - Register models written by external training jobs when their manifest-created event arrives
    capabilities:
      - S3-compatible API
      - Scoped application keys
      - Multipart upload
      - Event notifications
      - Object versions and lifecycle rules
      - SSE-B2 and Object Lock
      - Presigned URLs
    integrations:
      - id: mlflow
        name: MLflow
        role: Experiment tracking, artifact store, and model registry
        support: native-b2
        connection: Native b2://<bucket>@s3.<region>.backblazeb2.com/<path> artifact URIs; s3:// with MLFLOW_S3_ENDPOINT_URL also works
        url: https://mlflow.org/docs/latest/self-hosting/architecture/artifact-store/
        evidence: MLflow artifact store documentation (Backblaze B2 section) and source (mlflow/store/artifact/b2_artifact_repo.py) reviewed 2026-10-14; sample application tests 2026-10-14
      - id: wandb
        name: Weights & Biases
        role: Experiment tracking with reference artifacts in customer storage
        support: s3-compatible-endpoint
        connection: Reference artifacts on s3:// URIs with AWS_S3_ENDPOINT_URL set to the B2 endpoint
        url: https://docs.wandb.ai/guides/artifacts/track-external-files/
        evidence: W&B S3 storage handler source review recorded 2026-05 (reads AWS_S3_ENDPOINT_URL)
      - id: clearml
        name: ClearML
        role: Experiment tracking, model repository, and pipelines
        support: s3-compatible-endpoint
        connection: output_uri on the B2 endpoint with host-specific credentials in clearml.conf
        url: https://clear.ml/docs/latest/docs/integrations/storage/
        evidence: ClearML storage documentation lists Backblaze B2 under non-AWS S3 endpoints; reviewed 2026-10-14
    prerequisites:
      - A tracking database such as PostgreSQL on block storage
      - A B2 bucket for run artifacts and registered models
      - Separate keys for the tracking server or clients, the event receiver, and administrators
      - An HTTPS endpoint for B2 event notifications when automatic registration is used
    expected_scale:
      profile: Thousands of runs per month with artifacts from kilobytes to hundreds of gigabytes
      notes: Metadata scale is bound by the tracking database, not B2. Large model files use multipart uploads from the client; proxied artifact serving moves that bandwidth onto the tracking server.
    validation:
      status: source-reviewed-and-automated-tests
      date: "2026-10-14"
      methods:
        - MLflow artifact repository source review
        - W&B and ClearML storage handler review
        - Moto-backed tests for MLflow logging, registration, and signed event handling
      evidence:
        - applications/mlflow-b2-model-registry/tests
        - architectures/track-experiments-and-register-models/architecture.md
    security_considerations:
      - Prefer direct client artifact access with scoped keys, or proxied serving when clients must not hold B2 credentials
      - Verify the X-Bz-Event-Notification-Signature header before registering anything
      - Make event handling idempotent because notifications are delivered at least once
      - Keep the tracking database and its credentials off B2
    compliance_considerations:
      - Record dataset id, dataset fingerprint, and source checkpoint on every registered version
      - Lock artifacts of production model versions when audits require immutability
      - Apply the same deletion obligations to run artifacts as to the training data they derive from
    links:
      architecture: architectures/track-experiments-and-register-models/architecture.md
      application: applications/mlflow-b2-model-registry/README.md
      deployment: infrastructure/mlflow/README.md
      sample_data: testdata/synthetic-shapes/README.md
      run_contract: docs/training-run-contract.md

  - id: pin-dataset-versions
    name: Pin dataset versions for reproducible training runs
    slug: pin-dataset-versions
    summary: Version training data on B2 with a data-versioning tool or immutable release prefixes, and pin every run to an exact version and fingerprint.
    audience:
      - ML engineers who need reproducible experiments
      - Data engineers who maintain training datasets
      - Model governance and audit teams
    problem: Reproduce or audit a training run months later even though the underlying dataset kept changing.
    workflow:
      - Store dataset objects on B2 under a versioning tool or immutable version prefixes
      - Commit or tag a dataset version and record its identifier and fingerprint
      - Resolve the pinned version at training start and refuse mismatches
      - Write the pin into checkpoint, model, and tracking metadata
      - Retain pinned versions for as long as models trained on them are in use
    capabilities:
      - S3-compatible API
      - Scoped application keys
      - Object versions and lifecycle rules
      - Object Lock
      - Cloud Replication for disaster recovery
    integrations:
      - id: lakefs
        name: lakeFS
        role: Git-like branches, commits, and tags over object storage
        support: s3-compatible-endpoint
        connection: S3 blockstore with blockstore.s3.endpoint set to the B2 endpoint and path-style addressing
        url: https://docs.lakefs.io/latest/howto/deploy/
        evidence: lakeFS S3 block adapter source review recorded 2026-05 (pkg/block/s3/adapter.go); lakeFS quickstart and notebook in the sample organization
      - id: dvc
        name: DVC
        role: Dataset and model versioning tied to Git commits
        support: s3-compatible-endpoint
        connection: s3 remote with endpointurl set to the B2 endpoint
        url: https://dvc.org/doc/user-guide/data-management/remote-storage/amazon-s3
        evidence: DVC config schema and dvc-s3 source review recorded 2026-05
      - id: hf-datasets
        name: Hugging Face Datasets
        role: Dataset loading and preprocessing for transformer training
        support: s3-compatible-endpoint
        connection: fsspec storage_options with client_kwargs.endpoint_url set to the B2 endpoint
        url: https://huggingface.co/docs/datasets/filesystems
        evidence: Hugging Face Datasets filesystem documentation reviewed 2026-10-14
    prerequisites:
      - A B2 bucket for the versioning tool's storage namespace or immutable dataset prefixes
      - The versioning tool's metadata store where it needs one, such as the lakeFS database
      - Keys scoped to the dataset bucket with read-only access for training jobs
    expected_scale:
      profile: Datasets from gigabytes to petabytes with frequent incremental updates
      notes: Versioning tools deduplicate unchanged objects, so storage grows with changed data rather than with the number of versions.
    validation:
      status: source-reviewed
      date: "2026-10-14"
      methods:
        - lakeFS and DVC source review
        - Hugging Face Datasets filesystem documentation review
        - Shard manifest fingerprint pinning exercised by the PyTorch sample tests
      evidence:
        - architectures/pin-dataset-versions/architecture.md
        - applications/pytorch-b2-checkpointed-training/tests
    security_considerations:
      - Give training jobs read-only keys; only the versioning service or publisher writes
      - Protect tags or release prefixes that production models depend on from deletion
      - Keep versioning-tool databases and credentials off B2
    compliance_considerations:
      - Keep pinned versions available for the lifetime of dependent models or record why they were deleted
      - Honor deletion requests by producing a new version and retraining, not by editing a pinned version in place
    links:
      architecture: architectures/pin-dataset-versions/architecture.md
      application: null
      deployment: https://docs.lakefs.io/latest/howto/deploy/
      sample_data: testdata/synthetic-shapes/README.md
      run_contract: docs/training-run-contract.md

  - id: orchestrate-training-pipelines
    name: Orchestrate training pipelines and retrain when new data lands
    slug: orchestrate-training-pipelines
    summary: Run preprocessing, training, evaluation, and registration as pipeline steps that exchange artifacts through B2, and trigger retraining from B2 event notifications.
    audience:
      - MLOps platform teams
      - ML engineers automating retraining
      - Kubernetes platform operators
    problem: Make multi-step training workflows reproducible and restartable, and start retraining automatically when a new dataset version is published.
    workflow:
      - Configure the orchestrator's artifact store on B2
      - Pass step outputs between pipeline steps as B2 objects
      - Publish a new dataset version and write its manifest last
      - Receive the manifest-created event, verify it, and trigger the pipeline
      - Train, evaluate, and register the model with lineage to the triggering dataset version
    capabilities:
      - S3-compatible API
      - Scoped application keys
      - Event notifications
      - Object versions and lifecycle rules
      - SSE-B2
    integrations:
      - id: zenml
        name: ZenML
        role: ML pipeline framework with pluggable stacks
        support: native-b2
        connection: B2 artifact store flavor with a regional endpoint, plus the S3 flavor with a custom endpoint_url
        url: https://sdkdocs.zenml.io/0.96.1/integration_code_docs/integrations-b2.html
        evidence: ZenML 0.96.1 SDK documentation for the b2 integration and its source (src/zenml/integrations/b2) reviewed 2026-10-14
      - id: kubeflow-pipelines
        name: Kubeflow Pipelines
        role: Kubernetes-native ML pipelines
        support: s3-compatible-endpoint
        connection: S3-compatible object store configuration with endpoint, region, and path-style settings for the API server and launcher
        url: https://www.kubeflow.org/docs/components/pipelines/
        evidence: KFP object store source review and live S3-compatible round trip recorded 2026-06
      - id: metaflow
        name: Metaflow
        role: ML workflow framework with a content-addressed datastore
        support: s3-compatible-endpoint
        connection: S3 datastore with METAFLOW_S3_ENDPOINT_URL set to the B2 endpoint
        url: https://docs.metaflow.org/getting-started/infrastructure
        evidence: Metaflow S3 datastore source review recorded 2026-05
      - id: flyte
        name: Flyte
        role: Kubernetes-native workflow orchestration for ML
        support: s3-compatible-endpoint
        connection: storage.type s3 with storage.connection.endpoint set to the B2 endpoint and access-key authentication
        url: https://docs.flyte.org/
        evidence: Flyte storage configuration source review recorded 2026-05 (flytestdlib/storage)
      - id: kedro
        name: Kedro
        role: Data and ML pipeline project framework
        support: s3-compatible-endpoint
        connection: Catalog credentials with client_kwargs.endpoint_url passed to s3fs
        url: https://docs.kedro.org/en/stable/catalog-data/data_catalog_yaml_examples.html
        evidence: Kedro fsspec credential handling source review recorded 2026-07
      - id: argo-workflows
        name: Argo Workflows
        role: Kubernetes workflow engine for training jobs
        support: s3-compatible-endpoint
        connection: S3 artifact repository with an explicit endpoint, bucket, and key secrets
        url: https://argo-workflows.readthedocs.io/en/latest/configure-artifact-repository/
        evidence: Argo Workflows S3 artifact driver source review recorded 2026-05 (workflow/artifacts/s3/s3.go)
    prerequisites:
      - An orchestrator deployment with its metadata database off B2
      - A B2 bucket or prefix for pipeline artifacts with lifecycle rules for intermediate outputs
      - An HTTPS event receiver that can authenticate to the orchestrator's trigger API
    expected_scale:
      profile: Tens to thousands of pipeline runs per day with intermediate artifacts of any size
      notes: Intermediate artifacts dominate object count; expire them with lifecycle rules and keep only registered models and pinned datasets long term.
    validation:
      status: source-reviewed
      date: "2026-10-14"
      methods:
        - Orchestrator artifact-store source and configuration review
        - B2 event notification documentation review
        - Signed event handling exercised by the MLflow sample tests
      evidence:
        - architectures/orchestrate-training-pipelines/architecture.md
        - applications/mlflow-b2-model-registry/tests
    security_considerations:
      - Scope each pipeline's key to its artifact prefix
      - Verify event signatures and deduplicate events before triggering runs
      - Do not give event receivers credentials that can modify datasets
    compliance_considerations:
      - Record the triggering dataset version on every pipeline run and resulting model
      - Expire intermediate artifacts that contain derived personal data on the same schedule as their sources
    links:
      architecture: architectures/orchestrate-training-pipelines/architecture.md
      application: null
      deployment: https://argo-workflows.readthedocs.io/en/latest/configure-artifact-repository/
      sample_data: testdata/synthetic-shapes/README.md
      run_contract: docs/training-run-contract.md
